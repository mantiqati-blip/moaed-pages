<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>لوحة الصالون — موعد أنوثة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF5F7;--card:#fff;--ink:#2A1722;--mute:#7A6571;--line:#EBDCE3;--ac:#B83A6B;--soft:#F8E3EC;--ok:#1a7f4b;--bad:#c0392b}
*{box-sizing:border-box}body{font-family:Cairo,sans-serif;background:var(--bg);color:var(--ink);margin:0}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
header b{color:var(--ac);font-size:20px}main{max-width:720px;margin:0 auto;padding:18px}
nav{display:flex;gap:8px;margin-bottom:16px}nav{flex-wrap:wrap}nav button{flex:1 1 28%;padding:10px 4px;font-size:14px}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 16px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button.on,button.p{background:var(--ac);border-color:var(--ac);color:#fff}button:disabled{opacity:.5}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.s{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.m{color:var(--mute);font-size:14px}
label{display:block;font-weight:600;margin:12px 0 4px}input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}@media(max-width:520px){.g3{grid-template-columns:1fr}}
.d{display:grid;grid-template-columns:80px 1fr 1fr 70px;gap:8px;align-items:center;margin:8px 0}.d input{padding:8px}.d input[type=checkbox]{width:20px;height:20px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.tag{background:var(--soft);border-radius:8px;padding:2px 10px;font-size:13px}.tag.off{background:#eee;color:var(--mute)}
</style></head><body>
<header><b id="sn">لوحة الصالون</b><span><span class="m" id="me"></span> <button id="out" hidden>خروج</button></span></header>
<main id="app"><div class="row">جارٍ التحقق من الدخول...</div></main>
<script type="module">
import { configured, auth, db } from './js/fb.js';
import { summarize, money, effectiveFees, currentPeriod } from './js/finance.js';

const $ = (i) => document.getElementById(i), app = $('app');

const A = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');
const F = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');

[1, 2, 3, 4, 5, 6].forEach((i) => $('t' + i).onclick = () => tab(i));
const msgEl = () => $('msg'), say = (t, c = '') => { msgEl().className = 'm ' + c; msgEl().textContent = t; };

    try { await F.addDoc(col, { name: $('n').value.trim(), price, durationMin: Number($('d').value), active: true, createdAt: F.serverTimestamp() }); services(); } catch (e) { say('تعذر الحفظ: ' + e.code, 'bad'); }

const DAYS = [[6, 'السبت'], [0, 'الأحد'], [1, 'الاثنين'], [2, 'الثلاثاء'], [3, 'الأربعاء'], [4, 'الخميس'], [5, 'الجمعة']];

async function staff() {

const ST = { confirmed: 'مؤكد', completed: 'تمت الخدمة', no_show: 'لم تحضر', cancel_requested: 'طلب إلغاء', pending_admin: 'بانتظار قرار الإدارة', cancelled: 'ملغي' };
let bf = 'today';

    (L.length ? L.map((b) => {

        if (b.source !== 'online') a.push(`<button data-a="cx" data-id="${esc(b.id)}">إلغاء</button>`);
        else if (b.start > now && !b.moveProposal) a.push(`<button data-a="mv" data-id="${esc(b.id)}">اقتراح تغيير الموعد</button>`);
        else if (b.moveProposal) a.push(`<div class="m" style="width:100%">اقتراح النقل بانتظار ردّ الزبونة (${dk(b.moveProposal.start)} ${hm(b.moveProposal.start)}).</div>`);

      return `<div class="row"><div class="s"><b>${hm(b.start)} — ${esc(b.customerName || (b.source === 'blocked' ? 'وقت مغلق' : '—'))}</b><span class="tag ${b.status === 'confirmed' ? '' : 'off'}">${ST[b.status] || esc(b.status)}</span></div>
      <div class="m">${esc((b.services || []).map((x) => x.name).join('، '))} · ${esc(names[b.staffId] || '')}${b.source === 'online' ? '' : ' · يدوي'}</div><div class="m" dir="ltr" style="text-align:right">${esc(b.customerPhone || '')}</div>
      ${a.length ? `<div class="s" style="justify-content:flex-start;margin-top:8px">${a.join('')}</div>` : ''}</div>`;
    }).join('') : '<div class="row">لا توجد حجوزات.</div>') + '<button id="ex" style="width:100%">تصدير كل حجوزات الصالون (Excel)</button><div id="msg" class="m" role="status"></div>';
  v.querySelectorAll('[data-f]').forEach((b) => b.onclick = () => { bf = b.dataset.f; bookings(); });
  $('ex').onclick = () => { download(`bookings-${sid}-${dateOf(Date.now())}.csv`, toCSV(all, bookingColumns({ names }))); say(`صُدّر ${all.length} حجز. افتحي الملف بـ Excel.`, 'ok'); };
  v.querySelectorAll('[data-a]').forEach((b) => b.onclick = async () => {
    const id = b.dataset.id, ref = F.doc(db, 'bookings', id), a = b.dataset.a; let upd;
    if (a === 'done') { upd = { status: 'completed', completedAt: Date.now() }; if (b.dataset.o === '1') { const c = b.parentNode.querySelector('input').value.trim(); if (!/^\d{4}$/.test(c)) return say('أدخلي رمز الزبونة (٤ أرقام).', 'bad'); upd.codeEntered = c; } }
    else if (a === 'ns') { if (!confirm('تسجيل أن الزبونة لم تحضر؟')) return; upd = { status: 'no_show', noShowAt: Date.now() }; }
    else { const r = (prompt(a === 'cx' ? 'سبب الإلغاء؟' : a === 'ok' ? 'سبب الموافقة؟' : 'سبب رفض الإلغاء؟') || '').trim(); if (!r) return; upd = a === 'cx' ? { status: 'cancelled', directReason: r } : { status: a === 'ok' ? 'pending_admin' : 'confirmed', ownerReason: r }; }
    b.disabled = true;
    try {
      if (a === 'cx') {   // إلغاء مباشر: يحرّر خلايا الوقت من جدول الموظفة بنفس العملية
        const bk = all.find((x) => x.id === id), d = new Date(bk.start + 3 * 36e5), del = {};
        cellKeys(d.getUTCHours() * 60 + d.getUTCMinutes(), bk.durationMin).forEach((k) => del['cells.' + k] = F.deleteField());

    const H = salon.hours, AR = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'], days = [];
    if (!H || !stf.length) { box.innerHTML = '<div class="m">حدّدي الدوام وموظفة معتمدة أولًا.</div>'; return; }
    for (let k = 0; k < 14; k++) { const d = new Date(Date.now() + 3 * 36e5 + k * 864e5), h = H[d.getUTCDay()]; if (h && !h.off) days.push(d); }
    box.innerHTML = `<label>الموظفة</label><select data-sf>${stf.map((x) => `<option value="${esc(x.id)}" ${x.id === b.staffId ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
      <div class="s" style="justify-content:flex-start;gap:6px;margin-top:8px;flex-wrap:wrap">${days.map((d) => `<button type="button" data-d="${d.toISOString().slice(0, 10)}">${AR[d.getUTCDay()]} ${d.getUTCDate()}/${d.getUTCMonth() + 1}</button>`).join('')}</div><div data-tm></div>

async function accounts() {
