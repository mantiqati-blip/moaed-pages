<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>موعد أنوثة — احجزي موعدك في صالونات وعيادات التجميل</title>
<meta name="description" content="احجزي موعدك أونلاين في صالونات التجميل وعيادات العناية النسائية في العراق، اختاري المحافظة والمنطقة والموعد المناسب.">
<meta property="og:type" content="website"><meta property="og:locale" content="ar_IQ"><meta property="og:title" content="موعد أنوثة"><meta property="og:description" content="احجزي موعدك أونلاين في صالونات وعيادات التجميل."><meta name="theme-color" content="#B83A6B">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF5F7;--card:#fff;--ink:#2A1722;--mute:#7A6571;--line:#EBDCE3;--ac:#B83A6B;--soft:#F8E3EC}
@media(prefers-color-scheme:dark){:root{--bg:#1d1219;--card:#2a1b24;--ink:#f6e9ef;--mute:#c2a8b6;--line:#4a3441;--ac:#e0709b;--soft:#3b2431}}
*{box-sizing:border-box}body{font-family:Cairo,sans-serif;background:var(--bg);color:var(--ink);margin:0}
header{padding:16px 20px;background:var(--card);border-bottom:1px solid var(--line)}header b{color:var(--ac);font-size:22px}
main{max-width:560px;margin:0 auto;padding:16px}.row{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0}
.s{display:flex;justify-content:space-between;align-items:center;gap:10px}.m{color:var(--mute);font-size:14px}h2{font-size:17px;margin:20px 0 6px}
a.row{display:block;color:inherit;text-decoration:none}a.row:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
label.row{cursor:pointer}input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac)}
button{font:inherit;font-weight:700;width:100%;background:var(--ac);color:#fff;border:0;border-radius:14px;padding:14px;margin-top:10px}button:disabled{opacity:.45}

.h{display:flex;justify-content:space-between;padding:4px 0}.t{font-weight:700;font-size:18px}
</style></head><body><header class="s"><b>موعد أنوثة</b><a href="?my=1" style="color:var(--ac);font-weight:700">حجوزاتي</a></header><main id="app"><div class="row">جارٍ التحميل...</div></main><footer style="max-width:560px;margin:8px auto 24px;padding:0 16px;font-size:13px;display:flex;gap:16px;justify-content:center"><a href="terms.html" style="color:var(--mute)">الشروط</a><a href="privacy.html" style="color:var(--mute)">الخصوصية</a></footer>
<script type="module">
import { configured, auth, db, app as fbApp } from './js/fb.js';
import { bookSlot, rescheduleBooking, acceptMove } from './js/booking.js';
import { slotsFor, fmt } from './js/avail.js';
import { effectiveFees } from './js/finance.js';
import { filterSalons, govOptions, areaOptions, itemListJsonLd, topServices } from './js/directory.js';
const app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => Number(n).toLocaleString('en') + ' د.ع';
const slug = new URLSearchParams(location.search).get('salon'), my = new URLSearchParams(location.search).get('my');
const unavailable = () => { app.innerHTML = '<div class="row"><b>الحجز غير متاح حاليًا.</b><div class="m">الصالون غير موجود أو متوقف مؤقتًا.</div></div>'; };
if (!configured) { app.innerHTML = '<div class="row">الموقع قيد الإعداد.</div>'; throw 0; }
const A = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');
const F = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');
try {
  await auth.authStateReady?.(); if (!auth.currentUser) await A.signInAnonymously(auth);
  F.getDoc(F.doc(db, 'platform', 'settings')).then((d) => {                       // رقم الدعم: يحدده الأدمن، ولا يظهر شيء إن كان فارغًا
    const n = String(d.data()?.supportWhatsapp || ''); if (!/^07[3-9][0-9]{8}$/.test(n)) return;
    const a = document.createElement('a'); a.href = 'https://wa.me/964' + n.slice(1); a.target = '_blank'; a.rel = 'noopener'; a.style.color = 'var(--ac)'; a.textContent = 'الدعم (واتساب)';
    document.querySelector('footer')?.prepend(a);
  }).catch(() => {});
  if (my) {
    const sets0 = (await F.getDoc(F.doc(db, 'platform', 'settings'))).data() || {}, cut = Number(sets0.cancelCutoffHours ?? 2);
    const L = (await F.getDocs(F.query(F.collection(db, 'bookings'), F.where('customerUid', '==', auth.currentUser.uid)))).docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => b.start - a.start);
    const nm = {}, SD = {}, codes = {}, SA = { confirmed: 'مؤكد', completed: 'تمت الخدمة', no_show: 'لم تحضري', cancel_requested: 'طلب الإلغاء قيد المراجعة', pending_admin: 'طلب الإلغاء قيد المراجعة', cancelled: 'ملغي' };
    for (const id of new Set(L.map((b) => b.salonId))) { try { SD[id] = (await F.getDoc(F.doc(db, 'salons', id))).data() || {}; nm[id] = SD[id].name || id; } catch (e) { nm[id] = id; } }
    await Promise.all(L.filter((b) => b.status === 'confirmed').map(async (b) => { try { codes[b.id] = (await F.getDoc(F.doc(db, 'bookings', b.id, 'private', 'code'))).data()?.code; } catch (e) {} }));
    const when = (t) => { const d = new Date(t + 3 * 36e5); return d.toISOString().slice(0, 10) + ' · ' + String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0'); };
    app.innerHTML = '<h2 style="font-size:20px;margin-top:8px">حجوزاتي</h2><div class="m">تظهر هنا الحجوزات التي تمت من هذا المتصفح فقط.</div>' + (L.length ? L.map((b) => {
      const can = b.status === 'confirmed' && b.source === 'online' && b.start - Date.now() >= cut * 36e5;
      const rs = can && !b.rescheduleCount && SD[b.salonId]?.hours, mp = b.status === 'confirmed' && b.moveProposal;
      return `<div class="row"><div class="s"><b>${esc(nm[b.salonId])}</b><span class="m">${SA[b.status] || esc(b.status)}</span></div><div class="m">${when(b.start)} · ${esc((b.services || []).map((x) => x.name).join('، '))}</div>

      ${mp ? `<div class="row" style="background:var(--soft);margin:8px 0"><b>الصالون اقترح نقل موعدك</b><div class="m">إلى ${when(mp.start)}</div><div class="m">السبب: ${esc(mp.reason)}</div><div class="s" style="gap:8px;margin-top:8px"><button data-mv="${esc(b.id)}" data-y="1" style="flex:1">موافقة</button><button data-mv="${esc(b.id)}" data-y="0" style="flex:1;background:transparent;color:var(--ac);border:1px solid var(--ac)">رفض (يتحول لطلب إلغاء)</button></div></div>` : ''}
      ${rs ? `<button data-rs="${esc(b.id)}" style="background:transparent;color:var(--ac);border:1px solid var(--ac)">تغيير الموعد (مرة واحدة)</button><div data-rp="${esc(b.id)}"></div>` : b.rescheduleCount && b.status === 'confirmed' ? '<div class="m">تم تعديل موعد هذا الحجز مرة، ولا يمكن تعديله ثانية.</div>' : ''}
      ${can ? `<button data-id="${esc(b.id)}" style="background:transparent;color:var(--ac);border:1px solid var(--ac)">طلب إلغاء</button>` : b.status === 'confirmed' && b.source === 'online' ? `<div class="m">انتهت مهلة الإلغاء (${cut} ساعة قبل الموعد)، تواصلي مع الصالون.</div>` : ''}</div>`;
    }).join('') : '<div class="row">لا توجد حجوزات.</div>') + '<a class="row" href="./">الصالونات</a><div id="mg" class="m" role="status"></div>';
    app.querySelectorAll('button[data-id]').forEach((b) => b.onclick = async () => {
      const r = (prompt('سبب الإلغاء (إلزامي):') || '').trim(); if (!r) return; b.disabled = true;
      try { await F.updateDoc(F.doc(db, 'bookings', b.dataset.id), { status: 'cancel_requested', cancelReason: r, cancelRequestedAt: Date.now() }); location.reload(); }
      catch (e) { b.disabled = false; document.getElementById('mg').textContent = 'تعذر إرسال الطلب (قد تكون المهلة انتهت): ' + (e.code || ''); }
    });
    app.querySelectorAll('button[data-rs]').forEach((btn) => btn.onclick = () => {
      const b = L.find((x) => x.id === btn.dataset.rs), box = app.querySelector(`[data-rp="${b.id}"]`), H = SD[b.salonId].hours, AR = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'], days = [];
      for (let k = 0; k < 14; k++) { const d = new Date(Date.now() + 3 * 36e5 + k * 864e5), h = H[d.getUTCDay()]; if (h && !h.off) days.push(d); }
      box.innerHTML = `<div class="chips" style="margin-top:8px">${days.map((d) => `<button class="chip" aria-pressed="false" data-d="${d.toISOString().slice(0, 10)}">${AR[d.getUTCDay()]} ${d.getUTCDate()}/${d.getUTCMonth() + 1}</button>`).join('')}</div><div data-tm></div>`;
      const tm = box.querySelector('[data-tm]');
      box.querySelectorAll('[data-d]').forEach((c) => c.onclick = async () => {
        box.querySelectorAll('[data-d]').forEach((x) => x.setAttribute('aria-pressed', x === c)); const day = c.dataset.d, h = H[new Date(day + 'T00:00:00Z').getUTCDay()]; tm.innerHTML = '<div class="m">جارٍ حساب الأوقات...</div>';
        try {
          const cells = { ...((await F.getDoc(F.doc(db, 'schedules', b.staffId + '_' + day))).data()?.cells || {}) }; for (const k of Object.keys(cells)) if (cells[k] === b.id) delete cells[k];   // خلايا حجزها نفسه ليست مشغولة عليها
          const sl = slotsFor({ open: h.open, close: h.close, durationMin: b.durationMin, cellsByStaff: { [b.staffId]: cells }, date: day, now: Date.now() });
          tm.innerHTML = sl.length ? `<div class="chips" style="margin-top:8px">${sl.map((x) => `<button class="chip" data-m="${x.m}">${fmt(x.m)}</button>`).join('')}</div>` : '<div class="m">لا توجد أوقات متاحة بهذا اليوم.</div>';
          tm.querySelectorAll('[data-m]').forEach((t) => t.onclick = async () => {
            if (!confirm(`تأكيد نقل الموعد إلى ${day} الساعة ${fmt(Number(t.dataset.m))}؟ لا يمكن تعديله بعدها.`)) return; t.disabled = true;
            try {
              if (sets0.useServerReschedule) {                                                       // التعديل من السيرفر عند تفعيله من platform/settings
                const FN = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js');
                await FN.httpsCallable(FN.getFunctions(fbApp, 'europe-west1'), 'rescheduleBooking')({ bookingId: b.id, date: day, startMin: Number(t.dataset.m) });
              } else
              await rescheduleBooking({ db, fs: { doc: F.doc, runTransaction: F.runTransaction, deleteField: F.deleteField }, user: auth.currentUser, bookingId: b.id, date: day, startMin: Number(t.dataset.m), cutoffHours: cut });
              location.reload(); }
            catch (e) { t.disabled = false; document.getElementById('mg').textContent = { SLOT_TAKEN: 'هذا الوقت انحجز قبل لحظات. اختاري وقتًا آخر.', TOO_LATE: 'انتهت مهلة التعديل، تواصلي مع الصالون.', ALREADY_RESCHEDULED: 'تم تعديل هذا الحجز سابقًا.' }[e.message] || ('تعذر تعديل الموعد: ' + (e.code || e.message)); }
          });
        } catch (e) { tm.innerHTML = '<div class="m bad">تعذر تحميل الأوقات.</div>'; }
      });
    });
    app.querySelectorAll('button[data-mv]').forEach((btn) => btn.onclick = async () => {
      const id = btn.dataset.mv, yes = btn.dataset.y === '1', say = (t) => { document.getElementById('mg').textContent = t; };
      if (!yes) { const r = (prompt('سبب الرفض (إلزامي):') || '').trim(); if (!r) return; btn.disabled = true;
        try { await F.updateDoc(F.doc(db, 'bookings', id), { status: 'cancel_requested', cancelReason: 'رفضت نقل الموعد: ' + r, cancelRequestedAt: Date.now(), moveProposal: F.deleteField() }); location.reload(); }
        catch (e) { btn.disabled = false; say('تعذر الإرسال: ' + (e.code || '')); } return; }
      btn.disabled = true;
      try {
        if (((await F.getDoc(F.doc(db, 'platform', 'settings'))).data() || {}).useServerMove) {      // القبول من السيرفر عند تفعيله من platform/settings
          const FN = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js');
          await FN.httpsCallable(FN.getFunctions(fbApp, 'europe-west1'), 'acceptMove')({ bookingId: id });
        } else
        await acceptMove({ db, fs: { doc: F.doc, runTransaction: F.runTransaction, deleteField: F.deleteField }, user: auth.currentUser, bookingId: id });
        location.reload(); }
      catch (e) { btn.disabled = false; say({ SLOT_TAKEN: 'الوقت المقترح لم يعد متاحًا. تواصلي مع الصالون أو اطلبي الإلغاء.', PAST: 'انتهى الوقت المقترح.' }[e.message] || ('تعذر النقل: ' + (e.code || e.message))); }
    });
  } else if (!slug) {
    // الرابط الموحد: الصالونات + انضمام صالون + دخول الصالون/الموظفة/الإدارة
    const safe = (p) => p.catch(() => null);
    const [ps, gv, ar] = await Promise.all([safe(F.getDocs(F.query(F.collection(db, 'publicSalons'), F.where('status', '==', 'active')))), safe(F.getDocs(F.collection(db, 'governorates'))), safe(F.getDocs(F.collection(db, 'areas')))]);
    const nameOf = (r) => Object.fromEntries((r?.docs || []).map((d) => [d.id, d.data().name]));
    const G = nameOf(gv), R = nameOf(ar), L = (ps?.docs || []).map((d) => ({ id: d.id, ...d.data() })).filter((x) => x.name).sort((x, y) => x.name.localeCompare(y.name, 'ar'));
    const where = (x) => [R[x.areaId], G[x.governorateId]].filter(Boolean).join('، ');
    const card = (x) => `<a class="row" href="?salon=${encodeURIComponent(x.id)}"><b>${esc(x.name)}</b>${where(x) ? `<div class="m">${esc(where(x))}</div>` : ''}</a>`, gOpts = govOptions(L, G);
    app.innerHTML = '<h2>احجزي موعدك</h2>' + (L.length > 1 ? `<div class="row"><label for="dq" class="m">ابحثي باسم الصالون</label><input type="text" id="dq" autocomplete="off" placeholder="مثال: الأميرة"><div class="chips" style="gap:8px"><select id="dg" aria-label="المحافظة" style="flex:1;margin:0"><option value="">كل المحافظات</option>${gOpts.map((o) => `<option value="${esc(o.id)}">${esc(o.name)}</option>`).join('')}</select><select id="da" aria-label="المنطقة" style="flex:1;margin:0" disabled><option value="">كل المناطق</option></select></div><label for="ds" class="m" style="margin-top:8px;display:block">ابحثي عن خدمة</label><input type="text" id="ds" autocomplete="off" placeholder="مثال: صبغة" disabled><div class="chips" id="dsc" style="margin-top:8px"></div><div class="m" id="dc" role="status" style="margin-top:8px"></div></div>` : '') + '<div id="sl">' + (L.length ? '' : '<div class="row">لا توجد صالونات متاحة بعد.</div>') + '</div>'
      + '<h2>لصاحبات الصالونات والعيادات</h2><a class="row" href="join.html"><b>قدّمي طلب انضمام</b><div class="m">سجّلي صالونك أو عيادتك، وتتواصل معك الإدارة للتحقق.</div></a><a class="row" href="login.html"><b>تسجيل الدخول</b><div class="m">صاحبة الصالون، الموظفة، أو الإدارة.</div></a>';
    if (L.length) {
      const el = (i) => document.getElementById(i), base = location.origin + location.pathname;
      const paint = () => {
        const R = filterSalons(L, { q: el('dq')?.value || '', g: el('dg')?.value || '', a: el('da')?.value || '', s: el('ds')?.value || '' });
        el('sl').innerHTML = R.length ? R.map(card).join('') : '<div class="row">لا توجد نتائج. جرّبي تغيير البحث أو المحافظة أو الخدمة.</div>';
        if (el('dc')) el('dc').textContent = R.length === L.length ? `${L.length} صالون` : `${R.length} من ${L.length} صالون`;
      };
      if (el('dq')) {
        // خدمات كل صالون (قراءتها عامة بالقواعد): تُحمَّل بعد ظهور القائمة، وأول 60 صالون فقط حتى لا تكثر القراءات
        Promise.all(L.slice(0, 60).map((x) => F.getDocs(F.collection(db, 'salons', x.id, 'services')).then((r) => { x.svc = r.docs.map((d) => d.data()).filter((v) => v.active && v.name).map((v) => v.name); }).catch(() => {}))).then(() => {
          const T = topServices(L); el('ds').disabled = false;
          el('dsc').innerHTML = T.map((t) => `<button type="button" class="chip" aria-pressed="false" data-s="${esc(t)}">${esc(t)}</button>`).join('');
          el('dsc').querySelectorAll('button').forEach((b) => b.onclick = () => { const on = b.getAttribute('aria-pressed') !== 'true'; el('ds').value = on ? b.dataset.s : ''; el('dsc').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b && on)); paint(); });
          paint();
        });
        el('ds').oninput = () => { el('dsc').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', 'false')); paint(); };
        el('dq').oninput = paint; el('da').onchange = paint;
        el('dg').onchange = () => { const o = areaOptions(L, el('dg').value, R); el('da').innerHTML = '<option value="">كل المناطق</option>' + o.map((x) => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join(''); el('da').disabled = !o.length; paint(); };
      }
      paint();
      const ld = document.createElement('script'); ld.type = 'application/ld+json'; ld.textContent = JSON.stringify(itemListJsonLd(L, base)).replace(/</g, '\\u003c'); document.head.appendChild(ld);
    }
  } else {
    const sd = await F.getDoc(F.doc(db, 'salons', slug)), S = sd.exists() ? sd.data() : null;
    if (!S || S.status !== 'active') { unavailable(); throw 0; }
    document.title = S.name + ' — موعد أنوثة';
    const nm = async (c, id) => { try { return (await F.getDoc(F.doc(db, c, id))).data()?.name || ''; } catch (e) { return ''; } };
    const [gv, ar, cfg, sv, st] = await Promise.all([nm('governorates', S.governorateId), nm('areas', S.areaId), F.getDoc(F.doc(db, 'platform', 'settings')),
      F.getDocs(F.collection(db, 'salons', slug, 'services')), F.getDocs(F.collection(db, 'salons', slug, 'staff'))]);
    const eff = effectiveFees(S, cfg.data() || {}), fee = Number(eff.customerFee) || 0, svc = sv.docs.map((d) => ({ id: d.id, ...d.data() })).filter((x) => x.active), staff = st.docs.map((d) => ({ id: d.id, ...d.data() })).filter((x) => x.status === 'active');
    const DAYS = [[6, 'السبت'], [0, 'الأحد'], [1, 'الاثنين'], [2, 'الثلاثاء'], [3, 'الأربعاء'], [4, 'الخميس'], [5, 'الجمعة']], H = S.hours;
    document.title = S.name + ' — موعد أنوثة';
    app.innerHTML = `<h2 style="font-size:22px;margin-top:8px">${esc(S.name)}</h2><div class="m">${esc([gv, ar].filter(Boolean).join(' — '))}</div>
    <h2>الخدمات</h2>` + (svc.length ? svc.map((x, i) => `<label class="row s"><span><b>${esc(x.name)}</b><div class="m">${x.durationMin} دقيقة · ${money(x.price)}</div></span><input type="checkbox" data-i="${i}"></label>`).join('') : '<div class="row m">لم تضف الصالون خدماتها بعد.</div>') +
    `<div class="row"><div class="h"><span>مجموع الخدمات</span><span id="a">${money(0)}</span></div><div class="h"><span>رسم الخدمة</span><span>${money(fee)}</span></div><div class="h t"><span>الإجمالي</span><span id="z">${money(0)}</span></div></div>
    <div id="bk"></div>
    <h2>ساعات الدوام</h2><div class="row">` + (H ? DAYS.map(([k, n]) => `<div class="h"><span>${n}</span><span>${H[k]?.off ? 'عطلة' : esc(H[k]?.open) + ' – ' + esc(H[k]?.close)}</span></div>`).join('') : '<span class="m">لم تُحدد بعد.</span>') + '</div>' +
    `<h2>الموظفات</h2><div class="row">${staff.length ? staff.map((x) => `<div>${esc(x.name)}</div>`).join('') : '<span class="m">لا توجد موظفات معتمدات بعد.</span>'}</div>`;

            services: L.map((x) => ({ id: x.id, name: x.name, price: x.price, durationMin: x.durationMin })), settings: sets, idempotencyKey: key, source: 'online', src: SRC.includes(p) ? p : null, customerName: name, customerPhone: ph });
