<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>لوحة الأدمن — موعد أنوثة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF5F7;--card:#fff;--ink:#2A1722;--mute:#7A6571;--line:#EBDCE3;--ac:#B83A6B;--soft:#F8E3EC;--ok:#1a7f4b;--bad:#c0392b}
*{box-sizing:border-box}body{font-family:Cairo,sans-serif;background:var(--bg);color:var(--ink);margin:0}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
header b{color:var(--ac);font-size:20px}main{max-width:720px;margin:0 auto;padding:18px}
nav{display:flex;gap:8px;margin-bottom:16px}nav{flex-wrap:wrap}nav button{flex:1 1 28%;padding:10px 4px;font-size:14px}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 16px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button.on,button.p{background:var(--ac);border-color:var(--ac);color:#fff}button:disabled{opacity:.5}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.s{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.m{color:var(--mute);font-size:14px}
label{display:block;font-weight:600;margin:12px 0 4px}input,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.g2{grid-template-columns:1fr}}
.ok{color:var(--ok)}.bad{color:var(--bad)}.tag{background:var(--soft);border-radius:8px;padding:2px 10px;font-size:13px}
.tag.off{background:#eee;color:var(--mute)}[dir=ltr]{text-align:left}
</style></head><body>
<header><b>لوحة الأدمن</b><span><span class="m" id="me"></span> <button id="out" hidden>خروج</button></span></header>
<main id="app"><div class="row">جارٍ التحقق من الدخول...</div></main>
<script type="module">
import { configured, auth, db } from './js/fb.js';
import { firebaseConfig } from './js/firebase-config.js';
import { cellKeys } from './js/cells.js';
import { summarize, validatePayment, money, effectiveFees, validFee, currentPeriod, canClose, periodRecord } from './js/finance.js';
import { toXLSX, downloadX, bookingColumns, dateOf, timeOf, STATUS } from './js/export.js';
const $ = (i) => document.getElementById(i), app = $('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const AD = '٠١٢٣٤٥٦٧٨٩', latin = (s) => String(s).replace(/[٠-٩]/g, (d) => AD.indexOf(d));
if (!configured) { app.innerHTML = '<div class="row bad">إعدادات Firebase غير مضبوطة.</div>'; throw 0; }
const A = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');
const F = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');
const App = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');
await auth.authStateReady?.();
const u = auth.currentUser; let role = null, name = '';
if (u && !u.isAnonymous) { try { const d = (await F.getDoc(F.doc(db, 'users', u.uid))).data(); if (d?.status === 'active') { role = d.role; name = d.name; } } catch (e) {} }
if (role !== 'admin') { app.innerHTML = '<div class="row">هذه الصفحة للأدمن فقط. <a href="login.html">سجّلي الدخول</a> بحساب الإدارة.</div>'; throw 0; }
$('me').textContent = name || 'أدمن'; $('out').hidden = false; $('out').onclick = async () => { await A.signOut(auth); location.href = 'login.html'; };
const audit = (action, target) => F.addDoc(F.collection(db, 'audit'), { by: u.uid, action, target, at: F.serverTimestamp() });
let gov = [], areas = [];
const [g, a] = await Promise.all([F.getDocs(F.collection(db, 'governorates')), F.getDocs(F.collection(db, 'areas'))]);
gov = g.docs.map((d) => ({ id: d.id, ...d.data() })).sort((x, y) => x.order - y.order);
areas = a.docs.map((d) => ({ id: d.id, ...d.data() })).sort((x, y) => x.order - y.order);
app.innerHTML = '<nav><button id="t1" class="on">الصالونات</button><button id="t2">إضافة صالون</button><button id="t3">الموظفات</button><button id="t4">الإلغاءات</button><button id="t5">الحسابات</button><button id="t6">كل الحجوزات</button><button id="t7">طلبات الانضمام</button><button id="t8">الرسوم</button></nav><div id="v"></div>';
const tab = (n) => { [1, 2, 3, 4, 5, 6, 7, 8].forEach((i) => $('t' + i).className = i === n ? 'on' : ''); [list, form, staffTab, cancelsTab, accountsTab, allBookings, appsTab, feesTab][n - 1](); };
[1, 2, 3, 4, 5, 6, 7, 8].forEach((i) => $('t' + i).onclick = () => tab(i));
// نسخة عامة بدون بيانات خاصة (لا هاتف ولا حساب) تعرضها الصفحة الرئيسية. فشلها لا يمنع العملية الأصلية.
const pubSync = (x, st) => F.setDoc(F.doc(db, 'publicSalons', x.id || x.slug), { name: x.name, slug: x.slug || x.id, governorateId: x.governorateId || '', areaId: x.areaId || '', status: st || x.status }).catch(() => {});
async function list() {
  const v = $('v'); v.innerHTML = '<div class="row">جارٍ التحميل...</div>';
  const s = await F.getDocs(F.collection(db, 'salons')), L = s.docs.map((d) => ({ id: d.id, ...d.data() }));
  const pv = Object.fromEntries((await F.getDocs(F.collection(db, 'salonPrivate')).catch(() => ({ docs: [] }))).docs.map((d) => [d.id, d.data().ownerPhone])), legacy = L.filter((x) => x.ownerPhone);
  if (!L.length) { v.innerHTML = '<div class="row">لا توجد صالونات بعد. أضيفي أول صالون من تبويب «إضافة صالون».</div>'; return; }
  v.innerHTML = '<div class="row s"><span class="m">القائمة العامة بالصفحة الرئيسية تُحدَّث تلقائيًا. استعملي الزر إذا نقصت صالونات قديمة.</span><button id="sy">مزامنة القائمة العامة</button></div>' + (legacy.length ? `<div class="row s"><span class="m bad">${legacy.length} صالون ما زال رقم هاتف صاحبته داخل وثيقة الصالون المقروءة علنًا.</span><button id="mg">نقل الأرقام لمكان خاص</button></div>` : '') + L.map((x) => `<div class="row s"><div><b>${esc(x.name)}</b> <span class="tag ${x.status === 'active' ? '' : 'off'}">${x.status === 'active' ? 'فعّال' : 'موقوف'}</span>
    <div class="m" dir="ltr">/s/${esc(x.slug)} · ${esc(pv[x.id] || x.ownerPhone || '')}</div></div><button data-id="${esc(x.id)}" data-st="${x.status === 'active' ? 'suspended' : 'active'}">${x.status === 'active' ? 'إيقاف' : 'تفعيل'}</button></div>`).join('');
  if ($('mg')) $('mg').onclick = async () => {
    if (!confirm(`نقل أرقام ${legacy.length} صالون إلى مكان خاص وحذفها من وثائق الصالونات؟`)) return; $('mg').disabled = true;
    try { for (let i = 0; i < legacy.length; i += 200) { const b = F.writeBatch(db); legacy.slice(i, i + 200).forEach((x) => { b.set(F.doc(db, 'salonPrivate', x.id), { ownerPhone: x.ownerPhone }); b.update(F.doc(db, 'salons', x.id), { ownerPhone: F.deleteField() }); }); await b.commit(); } await audit('salon.phones.migrate', String(legacy.length)).catch(() => {}); list(); }
    catch (e) { $('mg').disabled = false; alert('تعذر النقل: ' + (e.code || e.message)); }
  };
  $('sy').onclick = async () => { $('sy').disabled = true; await Promise.all(L.map((x) => pubSync(x))); $('sy').textContent = 'تمت المزامنة (' + L.length + ')'; };
  v.querySelectorAll('button[data-st]').forEach((b) => b.onclick = async () => {
    const st = b.dataset.st; if (st === 'suspended' && !confirm('إيقاف الصالون؟ لن يظهر للزبونات.')) return;
    b.disabled = true; try { await F.updateDoc(F.doc(db, 'salons', b.dataset.id), { status: st }); await pubSync(L.find((x) => x.id === b.dataset.id), st); await audit('salon.' + st, b.dataset.id); list(); } catch (e) { alert('تعذر التحديث: ' + e.code); b.disabled = false; }
  });
}
function form() {
  const v = $('v');
  v.innerHTML = `<form id="f" class="row"><label>اسم الصالون</label><input id="n" required>
  <label>رابط الصالون (حروف إنجليزية صغيرة وأرقام وشرطة)</label><input id="sl" dir="ltr" pattern="[a-z0-9]+(-[a-z0-9]+)*" required>
  <div class="g2"><div><label>المحافظة</label><select id="gv" required><option value="">اختاري</option>${gov.map((x) => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>
  <div><label>المنطقة</label><select id="ar" required><option value="">اختاري المحافظة أولًا</option></select></div></div>
  <label>اسم صاحبة الصالون (ثلاثي)</label><input id="on" required>
  <label>رقم هاتفها (07XXXXXXXXX)</label><input id="ph" dir="ltr" inputmode="numeric" required>
  <div class="g2"><div><label>اسم المستخدم</label><input id="un" dir="ltr" pattern="[a-z0-9]+" required></div>
  <div><label>كلمة السر المؤقتة (٨ خانات فأكثر وفيها رقم)</label><input id="pw" dir="ltr" type="text" minlength="8" required></div></div>
  <div id="msg" class="m" role="status"></div><button class="p" id="go">إنشاء الصالون والحساب</button></form>`;
  $('gv').onchange = (e) => { $('ar').innerHTML = '<option value="">اختاري</option>' + areas.filter((x) => x.governorateId === e.target.value).map((x) => `<option value="${x.id}">${esc(x.name)}</option>`).join(''); };
  $('f').onsubmit = async (ev) => {
    ev.preventDefault(); const msg = (t, c = '') => { $('msg').className = 'm ' + c; $('msg').textContent = t; };
    const slug = $('sl').value.trim(), un = $('un').value.trim().toLowerCase(), ph = latin($('ph').value.trim()), pw = $('pw').value, on = $('on').value.trim();
    if (on.split(/\s+/).length < 3) return msg('اسم صاحبة الصالون لازم يكون ثلاثيًا.', 'bad');
    if (!/^07[3-9]\d{8}$/.test(ph)) return msg('رقم الهاتف غير صحيح (مثال: 07701234567).', 'bad');
    if (pw.length < 8 || !/\d/.test(pw)) return msg('كلمة السر: ٨ خانات فأكثر وفيها رقم.', 'bad');
    $('go').disabled = true; msg('جارٍ الإنشاء...');
    let sApp = null;
    try {
      if ((await F.getDoc(F.doc(db, 'salons', slug))).exists()) throw { code: 'slug-taken' };
      sApp = App.initializeApp(firebaseConfig, 'second-' + Date.now()); const sAuth = A.getAuth(sApp);
      const cred = await A.createUserWithEmailAndPassword(sAuth, un + '@local.salon', pw), ouid = cred.user.uid; await A.signOut(sAuth);
      try {
        const b = F.writeBatch(db);
        b.set(F.doc(db, 'users', ouid), { role: 'owner', status: 'active', salonId: slug, name: on });
        b.set(F.doc(db, 'salons', slug), { name: $('n').value.trim(), slug, status: 'active', ownerUid: ouid, governorateId: $('gv').value, areaId: $('ar').value, createdAt: F.serverTimestamp(), createdBy: u.uid });
        b.set(F.doc(db, 'salonPrivate', slug), { ownerPhone: ph });                  // الهاتف خارج وثيقة الصالون المقروءة علنًا
        await b.commit(); await pubSync({ name: $('n').value.trim(), slug, governorateId: $('gv').value, areaId: $('ar').value, status: 'active' });
      } catch (e) { throw { code: 'partial', msg: `أُنشئ حساب ${un} لكن فشل حفظ الصالون (${e.code}). احذفي الحساب من Authentication ثم أعيدي.` }; }
      await audit('salon.create', slug).catch(() => {});
      msg(`تم. الصالون: /s/${slug} واسم المستخدم: ${un}. سلّمي كلمة السر لصاحبة الصالون ولا تحتفظي بها.`, 'ok'); $('f').reset();
    } catch (e) {
      msg(e.msg || ({ 'slug-taken': 'هذا الرابط مستعمل لصالون آخر.', 'auth/email-already-in-use': 'اسم المستخدم مستعمل.', 'auth/weak-password': 'كلمة السر ضعيفة.', 'permission-denied': 'القواعد رفضت العملية.' }[e.code] || 'تعذر الإنشاء: ' + (e.code || e.message)), 'bad');
    } finally { $('go').disabled = false; if (sApp) App.deleteApp(sApp).catch(() => {}); }
  };
}
async function staffTab() {
  const v = $('v'); v.innerHTML = '<div class="row">جارٍ التحميل...</div>';
  const ss = await F.getDocs(F.collection(db, 'salons')), P = [];
  for (const sd of ss.docs) (await F.getDocs(F.collection(db, 'salons', sd.id, 'staff'))).docs.forEach((d) => { if (d.data().status === 'pending') P.push({ sid: sd.id, sname: sd.data().name, id: d.id, name: d.data().name }); });
  if (!P.length) { v.innerHTML = '<div class="row">لا توجد طلبات موظفات معلّقة.</div>'; return; }
  v.innerHTML = P.map((p, i) => `<form class="row" data-i="${i}"><b>${esc(p.name)}</b> <span class="m">— ${esc(p.sname)}</span>
    <div class="g2"><div><label>اسم المستخدم</label><input dir="ltr" pattern="[a-z0-9]+" required></div><div><label>كلمة السر المؤقتة (٨ فأكثر وفيها رقم)</label><input dir="ltr" minlength="8" required></div></div>
    <div class="m" role="status"></div><div class="s"><button class="p">موافقة وإنشاء الحساب</button><button type="button" data-rej="1">رفض</button></div></form>`).join('');
  v.querySelectorAll('form').forEach((f) => {
    const p = P[f.dataset.i], st = f.querySelector('.m[role]'), say = (t, c) => { st.className = 'm ' + c; st.textContent = t; };
    f.querySelector('[data-rej]').onclick = async () => { if (!confirm('رفض الطلب وحذفه؟')) return; try { await F.deleteDoc(F.doc(db, 'salons', p.sid, 'staff', p.id)); await audit('staff.reject', p.sid + '/' + p.id); staffTab(); } catch (e) { say('تعذر الحذف: ' + e.code, 'bad'); } };
    f.onsubmit = async (ev) => {
      ev.preventDefault(); const [un, pw] = [...f.querySelectorAll('input')].map((i) => i.value.trim()); const uname = un.toLowerCase();
      if (pw.length < 8 || !/\d/.test(pw)) return say('كلمة السر: ٨ خانات فأكثر وفيها رقم.', 'bad');
      f.querySelectorAll('button').forEach((b) => b.disabled = true); say('جارٍ الإنشاء...', ''); let sApp = null;
      try {
        sApp = App.initializeApp(firebaseConfig, 'st-' + Date.now()); const sA = A.getAuth(sApp);
        const uid = (await A.createUserWithEmailAndPassword(sA, uname + '@local.salon', pw)).user.uid; await A.signOut(sA);
        try {
          const b = F.writeBatch(db);
          b.set(F.doc(db, 'users', uid), { role: 'staff', status: 'active', salonId: p.sid, staffId: p.id, name: p.name });
          b.update(F.doc(db, 'salons', p.sid, 'staff', p.id), { status: 'active', uid }); await b.commit();
        } catch (e) { throw { msg: `أُنشئ حساب ${uname} لكن فشل الربط (${e.code}). احذفي الحساب من Authentication ثم أعيدي.` }; }
        await audit('staff.approve', p.sid + '/' + p.id).catch(() => {}); staffTab();
      } catch (e) { say(e.msg || ({ 'auth/email-already-in-use': 'اسم المستخدم مستعمل.', 'auth/weak-password': 'كلمة السر ضعيفة.' }[e.code] || 'تعذر الإنشاء: ' + (e.code || e.message)), 'bad'); f.querySelectorAll('button').forEach((b) => b.disabled = false); }
      finally { if (sApp) App.deleteApp(sApp).catch(() => {}); }
    };
  });
}
async function cancelsTab() {
  const v = $('v'); v.innerHTML = '<div class="row">جارٍ التحميل...</div>'; let L;
  try { L = (await F.getDocs(F.query(F.collection(db, 'bookings'), F.where('status', '==', 'pending_admin')))).docs.map((d) => ({ id: d.id, ...d.data() })); }
  catch (e) { v.innerHTML = '<div class="row bad">تعذر التحميل: ' + esc(e.code) + '</div>'; return; }
  if (!L.length) { v.innerHTML = '<div class="row">لا توجد طلبات إلغاء بانتظار قرارك.</div>'; return; }
  const when = (t) => { const d = new Date(t + 3 * 36e5); return d.toISOString().slice(0, 10) + ' ' + String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0'); };
  v.innerHTML = L.map((b, i) => `<div class="row"><b>${esc(b.customerName)}</b> <span class="m" dir="ltr">${esc(b.customerPhone)}</span><div class="m">صالون: ${esc(b.salonId)} · ${when(b.start)}</div>
    <div class="m">سبب الزبونة: ${esc(b.cancelReason)}</div><div class="m">ردّ الصالون: ${esc(b.ownerReason)}</div>
    <div class="s" style="justify-content:flex-start;margin-top:8px"><button class="p" data-i="${i}" data-y="1">إلغاء نهائي</button><button data-i="${i}" data-y="0">رفض الإلغاء</button></div></div>`).join('') + '<div id="msg" class="m" role="status"></div>';
  v.querySelectorAll('button[data-i]').forEach((btn) => btn.onclick = async () => {
    const b = L[btn.dataset.i], yes = btn.dataset.y === '1', r = (prompt(yes ? 'سبب الإلغاء النهائي (إلزامي):' : 'سبب رفض الإلغاء (إلزامي):') || '').trim(); if (!r) return;
    btn.disabled = true;
    try {
      const bt = F.writeBatch(db); bt.update(F.doc(db, 'bookings', b.id), { status: yes ? 'cancelled' : 'confirmed', adminReason: r, finalDecisionBy: u.uid });
      if (yes) { const d = new Date(b.start + 3 * 36e5), upd = {}; cellKeys(d.getUTCHours() * 60 + d.getUTCMinutes(), b.durationMin).forEach((k) => upd['cells.' + k] = F.deleteField()); bt.update(F.doc(db, 'schedules', b.staffId + '_' + d.toISOString().slice(0, 10)), upd); }
      await bt.commit(); await audit(yes ? 'booking.cancel' : 'booking.keep', b.id).catch(() => {}); cancelsTab();
    } catch (e) { btn.disabled = false; $('msg').className = 'm bad'; $('msg').textContent = 'تعذر التنفيذ: ' + (e.code || e.message); }
  });
}
async function accountsTab() {
  const v = $('v'); v.innerHTML = '<div class="row">جارٍ التحميل...</div>';
  try {
    const ss = await F.getDocs(F.collection(db, 'salons')), done = (await F.getDocs(F.query(F.collection(db, 'bookings'), F.where('status', '==', 'completed')))).docs.map((d) => d.data());
    const R = await Promise.all(ss.docs.map(async (sd) => { const [pg, pp] = await Promise.all([F.getDocs(F.collection(db, 'salons', sd.id, 'payments')), F.getDocs(F.collection(db, 'salons', sd.id, 'periods')).catch(() => ({ docs: [], size: 0 }))]); const last = pp.docs.map((d) => d.data().closedAt || 0).sort((a, b) => b - a)[0] || 0, cur = currentPeriod(done.filter((b) => b.salonId === sd.id), pg.docs.map((d) => d.data()), last); return { id: sd.id, name: sd.data().name, last, nPer: pp.size, per: pp.docs.map((d) => ({ id: d.id, at: d.data().closedAt || 0 })).sort((a, b) => b.at - a.at), obj: (await Promise.all(pp.docs.map((d) => F.getDoc(F.doc(db, 'salons', sd.id, 'periods', d.id, 'objections', 'main')).then((x) => x.exists() ? { pid: d.id, ...x.data() } : null).catch(() => null)))).filter((x) => x && x.status === 'open'), S: summarize(cur.bookings, cur.payments) }; }));
    if (!R.length) { v.innerHTML = '<div class="row">لا توجد صالونات.</div>'; return; }
    const tot = R.reduce((n, r) => n + r.S.remaining, 0);

      <div class="g2"><div><label>رسم الخدمة</label><input data-k="customerFee" dir="ltr" inputmode="numeric" placeholder="${sv(set.customerFee)}" value="${sv(s.customerFee)}"></div><div><label>الاستقطاع</label><input data-k="salonCut" dir="ltr" inputmode="numeric" placeholder="${sv(set.salonCut)}" value="${sv(s.salonCut)}"></div></div>
      <div class="m" data-m role="status"></div><button data-s="1">حفظ لهذا الصالون</button></div>`; }).join('') : '<div class="row">لا توجد صالونات.</div>');
  $('gs').onclick = async () => {
    const f = num($('gf').value), c = num($('gc').value), say = (t, k) => { $('gm').className = 'm ' + k; $('gm').textContent = t; };
    if (!validFee(f) || !validFee(c)) return say('أدخلي رقمين صحيحين (٠ فأكثر).', 'bad');
    if (!confirm(`حفظ الافتراضي: رسم ${f} واستقطاع ${c}؟ يؤثر على الصالونات بدون قيمة خاصة.`)) return;
    try { await F.updateDoc(F.doc(db, 'platform', 'settings'), { customerFee: f, salonCut: c }); await audit('fees.default', `fee ${set.customerFee}>${f}; cut ${set.salonCut}>${c}`).catch(() => {}); say('تم الحفظ.', 'ok'); feesTab(); }
    catch (e) { say('تعذر الحفظ: ' + (e.code || e.message), 'bad'); }
  };
  $('ps').onclick = async () => {
    const on = $('po').checked, say = (t, k) => { $('pm').className = 'm ' + k; $('pm').textContent = t; };
    if (on && !confirm('تأكدتِ أن Phone مفعّل بـ Firebase وأن الدومين مضاف؟ إذا لا، لن تستطيع أي زبونة الحجز.')) return;
    try { await F.updateDoc(F.doc(db, 'platform', 'settings'), { requirePhoneOtp: on }); await audit('settings.otp', String(on)).catch(() => {}); say('تم الحفظ.', 'ok'); }
    catch (e) { say('تعذر الحفظ: ' + (e.code || e.message), 'bad'); }
  };
  $('ss').onclick = async () => {
    const say = (t, k) => { $('sm').className = 'm ' + k; $('sm').textContent = t; }, n = latin($('sw').value.trim().replace(/[\s-]/g, ''));
    if (n !== '' && !/^07[3-9][0-9]{8}$/.test(n)) return say('الرقم لازم يكون بصيغة 07xxxxxxxxx.', 'bad');
    try { await F.updateDoc(F.doc(db, 'platform', 'settings'), { supportWhatsapp: n === '' ? F.deleteField() : n }); await audit('settings.support', n || 'removed').catch(() => {}); say('تم الحفظ.', 'ok'); }
    catch (e) { say('تعذر الحفظ: ' + (e.code || e.message), 'bad'); }
  };
  v.querySelectorAll('[data-s]').forEach((btn) => btn.onclick = async () => {
    const row = btn.closest('.row'), s = L[row.dataset.i], m = row.querySelector('[data-m]'), say = (t, k) => { m.className = 'm ' + k; m.textContent = t; }, upd = {}, log = [];
    for (const inp of row.querySelectorAll('input[data-k]')) { const k = inp.dataset.k, n = num(inp.value);
      if (n !== null && !validFee(n)) return say('أدخلي رقمًا صحيحًا (٠ فأكثر) أو اتركيه فارغًا.', 'bad');
      if (n === null) { if (Number.isInteger(s[k])) { upd[k] = F.deleteField(); log.push(`${k} ${s[k]}>افتراضي`); } } else if (n !== s[k]) { upd[k] = n; log.push(`${k} ${s[k] ?? 'افتراضي'}>${n}`); } }
    if (!log.length) return say('ما في تغيير.', '');
    btn.disabled = true;
    try { await F.updateDoc(F.doc(db, 'salons', s.id), upd); await audit('fees.salon', s.id + ': ' + log.join('; ')).catch(() => {}); say('تم الحفظ. يسري على الحجوزات الجديدة.', 'ok'); setTimeout(feesTab, 700); }
    catch (e) { btn.disabled = false; say('تعذر الحفظ: ' + (e.code || e.message), 'bad'); }
  });
}
tab(1);
</script></body></html>
